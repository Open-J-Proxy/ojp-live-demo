global:
  scrape_interval: 2s
  evaluation_interval: 2s
scrape_configs:
  - job_name: app
    static_configs:
      - targets: ["app:8081"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: ojp
    static_configs:
      - targets: ["ojp:9159"]
    # HA nodes are discovered only while their profile is running.
  - job_name: ojp-ha
    dns_sd_configs:
      - names: ["ojp2", "ojp3"]
        type: A
        port: 9159
        refresh_interval: 5s
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
